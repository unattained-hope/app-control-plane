# Apoaap Control Plane production stack on the OCI VM.
# TLS remains owned by the existing edge Caddy on EDGE_DOCKER_NETWORK; use the
# unique cp-prod-web alias so staging and production can never round-robin.
name: control-plane-production

x-control-plane-environment: &control-plane-environment
  NODE_ENV: production
  CONTROL_PLANE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@cp-postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://cp-redis:6379

services:
  control-plane:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *control-plane-environment
      PORT: "3000"
      BADGE_GRAPHIC_STORAGE_DIR: /data/badge-graphics
      BADGE_GRAPHIC_PUBLIC_BASE_URL: https://${CONTROL_PLANE_DOMAIN}
      BADGE_GRAPHIC_FALLBACK_DIR: ""
    command: ["node", "./build/server/prod.js"]
    volumes:
      - badge_graphics:/data/badge-graphics
    depends_on:
      cp-postgres:
        condition: service_healthy
      cp-redis:
        condition: service_healthy
    mem_limit: 2048m
    cpus: 1.0
    networks:
      default:
      edge:
        aliases:
          - cp-prod-web

  control-plane-schema:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: schema
    profiles:
      - operations
    env_file:
      - .env
    environment:
      <<: *control-plane-environment
      BADGE_GRAPHIC_STORAGE_DIR: /data/badge-graphics
    volumes:
      - badge_graphics:/data/badge-graphics
    depends_on:
      cp-postgres:
        condition: service_healthy
    networks:
      - default

  cp-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1024m
    cpus: 0.35

  cp-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    cpus: 0.15

volumes:
  pgdata:
  redisdata:
  badge_graphics:

networks:
  edge:
    external: true
    name: ${EDGE_DOCKER_NETWORK}
